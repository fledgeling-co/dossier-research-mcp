id: undici-release-timestamp-join
category: technical
topic: release-provenance
question: >-
  The undici package published version 7.29.0 on 24 July 2026. Three different
  timestamps exist for that one release: the npm registry's publish time, and
  the GitHub Releases API's `created_at` and `published_at` fields, which are
  not the same and only one of which the GitHub web interface shows. Give all
  three in UTC, and give the gap in whole minutes between GitHub's `created_at`
  and its `published_at` for this release.
asOf: 2026-07-24
reverifiedAt: 2026-07-29

requiredTerms: [undici]

goldFacts:
  - id: github-created
    label: GitHub Releases API created_at for v7.29.0
    kind: date
    value: '2026-07-24'
    source:
      url: https://api.github.com/repos/nodejs/undici/releases
      quote: '"created_at":"2026-07-24T10:52:50Z"'
      locator: the release whose tag_name is v7.29.0
  - id: gap-minutes
    label: minutes between GitHub created_at and published_at
    kind: number
    value: 120
    unit: minutes
    tolerance: { kind: absolute, value: 1 }
    source:
      url: https://api.github.com/repos/nodejs/undici/releases
      quote: '"created_at":"2026-07-24T10:52:50Z"'
      locator: >-
        created_at 10:52:50Z against published_at 12:53:02Z on the v7.29.0
        release is 120.2 minutes.
  - id: npm-publish
    label: the npm registry publish timestamp for 7.29.0
    kind: name
    value: '2026-07-24T12:52:58.701Z'
    aliases: ['2026-07-24T12:52:58Z', '12:52:58']
    source:
      url: https://registry.npmjs.org/undici
      quote: '"7.29.0":"2026-07-24T12:52:58.701Z"'
      locator: the time object
