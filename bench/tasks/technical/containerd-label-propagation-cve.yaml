id: containerd-label-propagation-cve
category: technical
topic: container-runtime-cves
question: >-
  In July 2026 an advisory was published for containerd, covering the CRI
  plugin propagating labels from an image config (the Dockerfile LABEL
  instruction) onto a container without validation, fixed in 1.7.33, 2.3.2,
  2.2.5, 2.1.9 and 2.0.10. Give the CVE identifier, the date NVD published the
  record, and the CVSS v3.1 base score NVD itself assigned.
