id: deeptrace-gemini-citation-accuracy
category: contested
topic: deeptrace-paper
question: >-
  The DeepTRACE paper (arXiv 2509.04499) audits deep-research systems for
  citation reliability. What citation accuracy does it report for Gemini's
  deep-research configuration, and is that figure stated consistently throughout
  the paper?
asOf: 2025-09-02
reverifiedAt: 2026-07-27

requiredTerms: [DeepTRACE, citation accuracy, Gemini]

conflictingFigures:
