name: Release

# Tag-triggered, never push-triggered. Publishing on every push to main is how
# you ship a broken version at 2am; a tag is a deliberate act. The tag must
# match the version in package.json or the job fails before it can publish.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the gate and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # The same gate that runs pre-push locally. A package that fails its own
      # tests must not reach the registry, so this sits before every publish.
      - name: Quality gate
        run: npm run gate

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      # src/version.ts is what the MCP handshake advertises. If it drifts from
      # package.json, clients report a version that was never released.
      - name: Check the advertised version matches
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('./dist/version.js').version")
          if [ "$SRC" != "$PKG" ]; then
            echo "::error::src/version.ts says $SRC but package.json says $PKG"
            exit 1
          fi

      - name: Pack and show contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
